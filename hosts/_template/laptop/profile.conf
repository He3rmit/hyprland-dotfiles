# Machine Identity — Laptop Template
# Copy this file to your profile folder and customize it.
HOST_TYPE="laptop"
DISTRO="arch"                 # arch, garuda, cachyos, endeavour, etc.
HAS_BATTERY=true
HAS_BACKLIGHT=true
HAS_TOUCHPAD=true

# Initial Waybar Settings
WAYBAR_LAYOUT="2-Topbar-Detailed"
WAYBAR_STYLE="5-Glass-Pill"
WAYBAR_POSITION=""              # optional override: top, bottom, left, right (empty uses layout default)

# Interactive Hardware Identity
KB_LAYOUT="us"
KB_VARIANT=""
KB_OPTIONS=""                   # e.g. "grp:alt_shift_toggle,caps:escape"

# DISPLAY & SCALING (Detected during installation)
MONITOR_NAME="auto"
SCALE="1.0"
