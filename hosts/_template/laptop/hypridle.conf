# -----------------------------------------------------
# HYPRIDLE CONFIGURATION (Laptop Profile)
# -----------------------------------------------------
# Tailored for portable battery-powered machines.

general {
    lock_cmd = pidof hyprlock || hyprlock       # avoid starting multiple hyprlock instances.
    before_sleep_cmd = loginctl lock-session    # lock before suspend.
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })' 2>/dev/null || hyprctl dispatch dpms on
    inhibit_sleep = 3
}

# --- 1. SCREEN DIMMING (2.5 minutes) ---
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 20%
    on-resume = brightnessctl -r
}

# --- 2. KEYBOARD BACKLIGHT (2.5 minutes) ---
listener {
    timeout = 150
    on-timeout = brightnessctl -sd rgb:kbd_backlight set 0
    on-resume = brightnessctl -rd rgb:kbd_backlight
}

# --- 3. LOCK SCREEN (5 minutes) ---
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# --- 4. SCREEN OFF / DPMS (5.5 minutes) ---
listener {
    timeout = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })' 2>/dev/null || hyprctl dispatch dpms off
    on-resume = (hyprctl dispatch 'hl.dsp.dpms({ action = "on" })' 2>/dev/null || hyprctl dispatch dpms on) && brightnessctl -r
}

# --- 5. SYSTEM SUSPEND (30 minutes) ---
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
