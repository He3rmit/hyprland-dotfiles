# -----------------------------------------------------
# HYPRIDLE CONFIGURATION (Desktop Profile)
# -----------------------------------------------------
# Tailored for stationary, wall-powered desktop setups.
# Desktop monitors do not use brightnessctl backlight dimming.

general {
    lock_cmd = pidof hyprlock || hyprlock       # avoid starting multiple hyprlock instances.
    before_sleep_cmd = loginctl lock-session    # lock before suspend.
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })' 2>/dev/null || hyprctl dispatch dpms on
    inhibit_sleep = 3
}

# --- 1. LOCK SCREEN (10 minutes) ---
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# --- 2. SCREEN OFF / DPMS (15 minutes) ---
listener {
    timeout = 900
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })' 2>/dev/null || hyprctl dispatch dpms off
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })' 2>/dev/null || hyprctl dispatch dpms on
}

# --- 3. OPTIONAL SYSTEM SUSPEND (Disabled by default for desktops) ---
