# -----------------------------------------------------
# HYPRIDLE CONFIGURATION (CORE)
# -----------------------------------------------------

# --- DEFAULT CORE TIMEOUTS (in seconds) ---
$TIMEOUT_DIM = 150
$TIMEOUT_KBD = 150
$TIMEOUT_LOCK = 300
$TIMEOUT_DPMS = 330
$TIMEOUT_SUSPEND = 1800

# --- HOST-SPECIFIC TIMEOUT OVERRIDES ---
# Sourced before listeners so hosts can override any of the $TIMEOUT_* variables
source = ~/.config/hypr/hypridle-host.conf

general {
    lock_cmd = pidof hyprlock || hyprlock       # avoid starting multiple hyprlock instances.
    before_sleep_cmd = loginctl lock-session    # lock before suspend.
    after_sleep_cmd = hyprctl dispatch dpms on  # to avoid having to press a key twice to turn on the display.
    inhibit_sleep = 3                           # wait until session is locked before letting system suspend
}

listener {
    timeout = $TIMEOUT_DIM                       # screen dimming
    on-timeout = brightnessctl -s set 20%        # dim to 20%
    on-resume = brightnessctl -r                # restore previous level
}

# turn off keyboard backlight, comment out this section if you dont have a keyboard backlight.
listener { 
    timeout = $TIMEOUT_KBD                      # keyboard backlight
    on-timeout = brightnessctl -sd rgb:kbd_backlight set 0
    on-resume = brightnessctl -rd rgb:kbd_backlight
}

listener {
    timeout = $TIMEOUT_LOCK                     # lock screen
    on-timeout = loginctl lock-session
}

listener {
    timeout = $TIMEOUT_DPMS                     # screen power off (DPMS)
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on && brightnessctl -r
}

listener {
    timeout = $TIMEOUT_SUSPEND                  # system suspend
    on-timeout = systemctl suspend
}

