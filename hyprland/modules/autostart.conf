# -----------------------------------------------------
# AUTOSTART & SERVICES
# -----------------------------------------------------

# --- CORE SERVICES ---
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE
exec-once = /usr/lib/hyprpolkitagent/hyprpolkitagent
exec-once = /usr/bin/gnome-keyring-daemon --start --components=secrets
exec-once = hypridle
exec-once = hyprsunset
exec-once = nm-applet --indicator &
# --- CLIPBOARD & SCRIPTS ---
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = ~/.config/hypr/scripts/xhost-root.sh
exec-once = ~/.config/hypr/scripts/wallpaper-selector.sh --init
exec-once = killall waybar; waybar
exec-once = ~/.config/hypr/scripts/portal-watcher.sh

# Note: Personalized Apps and Trays should be placed in your host-specific 
# override file (e.g. hosts/your-host/hypr-host.conf) so they don't break 
# other users' setups!