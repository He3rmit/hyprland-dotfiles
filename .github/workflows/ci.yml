name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "feature" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "feature" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------------------
  # JOB 1: Static Analysis, Linters & Syntax Verification
  # ----------------------------------------------------------------------------
  lint-and-syntax:
    name: Lint & Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Shell & Lua Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck lua5.4 jq

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python Linters
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Check Shell Scripts (bash -n & ShellCheck)
        run: |
          echo "=== 1. Checking Shell Syntax with bash -n ==="
          find . -name "*.sh" -not -path "./.git/*" -not -path "./main/*" -print0 | while IFS= read -r -d '' file; do
            bash -n "$file" || exit 1
          done
          echo "All shell scripts passed bash -n syntax check."

          echo "=== 2. Running ShellCheck ==="
          find . -name "*.sh" -not -path "./.git/*" -not -path "./main/*" -print0 | xargs -0 -r shellcheck --severity=warning

      - name: Check Lua Files (luac -p)
        run: |
          echo "=== 3. Checking Lua Syntax with luac -p ==="
          find . -name "*.lua" -not -path "./.git/*" -not -path "./main/*" -print0 | while IFS= read -r -d '' file; do
            luac -p "$file" || exit 1
          done
          echo "All Lua files passed luac syntax check."

      - name: Check Python Files (py_compile & ruff)
        run: |
          echo "=== 4. Checking Python Syntax with py_compile ==="
          find . -name "*.py" -not -path "./.git/*" -not -path "./main/*" -print0 | while IFS= read -r -d '' file; do
            python3 -m py_compile "$file" || exit 1
          done

          echo "=== 5. Running Ruff Linter ==="
          ruff check hyprland/scripts/ tests/

      - name: Validate JSON & JSONC Configurations
        run: |
          echo "=== 6. Validating JSON & Waybar JSONC Schemas ==="
          python3 tests/validate-jsonc.py

      - name: Validate CSS & RASI Style Themes
        run: |
          echo "=== 7. Validating CSS & Rofi RASI Style Themes ==="
          python3 tests/validate-styles.py

      - name: Validate Hypridle & Hyprlock Configurations
        run: |
          echo "=== 8. Validating Hypridle & Hyprlock Configurations ==="
          python3 tests/validate-hypr-configs.py

  # ----------------------------------------------------------------------------
  # JOB 2: Repository Hygiene, Security & Keybinding Integrity
  # ----------------------------------------------------------------------------
  repo-hygiene:
    name: Repo Hygiene, Security & Keybind Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Executable Permissions
        run: |
          echo "=== Checking executable bits on scripts ==="
          fail=0
          for file in $(git ls-files "*.sh" "*.py"); do
            if [ ! -x "$file" ]; then
              echo "❌ Missing executable bit (+x): $file"
              fail=1
            fi
          done
          if [ $fail -ne 0 ]; then
            echo "Run 'chmod +x <file>' and commit the permission fix."
            exit 1
          fi
          echo "✅ All shell and python scripts have executable (+x) bit set."

      - name: Verify Symlink Integrity
        run: |
          echo "=== Checking for broken symlinks in repository ==="
          broken=$(find . -xtype l -not -path "./.git/*" -not -path "./main/*")
          if [ -n "$broken" ]; then
            echo "❌ Broken symlinks found in repository:"
            echo "$broken"
            exit 1
          fi
          echo "✅ No broken symlinks detected."

      - name: Verify Host Profile Privacy (.gitignore enforcement)
        run: |
          echo "=== Verifying no personal host profiles or secrets are tracked ==="
          leaked_hosts=$(git ls-files "hosts/" | grep -v "^hosts/_template/" || true)
          if [ -n "$leaked_hosts" ]; then
            echo "❌ Privacy violation: Host-specific files tracked in git:"
            echo "$leaked_hosts"
            exit 1
          fi

          leaked_secrets=$(git ls-files "*secret*" | grep -v "\.example$" || true)
          if [ -n "$leaked_secrets" ]; then
            echo "❌ Security violation: Secret files tracked in git index!"
            echo "$leaked_secrets"
            exit 1
          fi
          echo "✅ Privacy rules satisfied (no personal host profiles or secrets committed)."

      - name: Validate Keybinding Target Integrity
        run: |
          echo "=== Verifying Keybind Script Targets ==="
          python3 tests/validate-keybind-targets.py

      - name: Scan for Secret Leaks (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  # ----------------------------------------------------------------------------
  # JOB 3: Functional Script Smoke Tests
  # ----------------------------------------------------------------------------
  script-smoke-tests:
    name: Functional Script Smoke Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Script Smoke Tests
        run: |
          echo "=== Running Non-Interactive Script Smoke Tests ==="
          bash tests/test-scripts-smoke.sh

  # ----------------------------------------------------------------------------
  # JOB 4: Arch Linux Multi-Template Deployment Matrix
  # ----------------------------------------------------------------------------
  arch-stow-matrix:
    name: Arch Stow Test (${{ matrix.template }})
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    strategy:
      fail-fast: false
      matrix:
        template: [laptop, desktop]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Test Dependencies
        run: |
          pacman -Syu --noconfirm git stow jq

      - name: Run Multi-Template Stow Test
        run: |
          echo "=== Testing Arch Linux Deployment for Template: ${{ matrix.template }} ==="
          export TEST_HOME="/tmp/mock-home-${{ matrix.template }}"
          export DOTFILES_DIR="$(pwd)"
          mkdir -p "$TEST_HOME/.config/hypr" "$TEST_HOME/.config/waybar" "$TEST_HOME/.config/swaync"

          # 1. Stow home & core
          stow -v --no-folding -t "$TEST_HOME" home
          stow -v --no-folding -t "$TEST_HOME/.config" core

          # 2. Deploy specified host template
          TEMPLATE_DIR="$DOTFILES_DIR/hosts/_template/${{ matrix.template }}"
          ln -sf "$TEMPLATE_DIR/hypr-host.lua" "$TEST_HOME/.config/hypr/hypr-host.lua"
          ln -sf "$TEMPLATE_DIR/profile.conf" "$TEST_HOME/.config/hypr/profile.conf"
          if [ -f "$TEMPLATE_DIR/hypridle.conf" ]; then
            ln -sf "$TEMPLATE_DIR/hypridle.conf" "$TEST_HOME/.config/hypr/hypridle.conf"
          else
            ln -sf "$DOTFILES_DIR/hyprland/hypridle.conf" "$TEST_HOME/.config/hypr/hypridle.conf"
          fi
          if [ -f "$TEMPLATE_DIR/hyprlock.conf" ]; then
            ln -sf "$TEMPLATE_DIR/hyprlock.conf" "$TEST_HOME/.config/hypr/hyprlock.conf"
          else
            ln -sf "$DOTFILES_DIR/hyprland/hyprlock.conf" "$TEST_HOME/.config/hypr/hyprlock.conf"
          fi

          # 3. Assert link validity
          [ -L "$TEST_HOME/.zshrc" ] || { echo "Failed: .zshrc symlink missing"; exit 1; }
          [ -f "$TEST_HOME/.config/swaync/config.json" ] || { echo "Failed: swaync config missing"; exit 1; }
          [ -f "$TEST_HOME/.config/waybar/common.jsonc" ] || { echo "Failed: waybar common.jsonc missing"; exit 1; }
          [ -f "$TEST_HOME/.config/hypr/hypr-host.lua" ] || { echo "Failed: hypr-host.lua missing"; exit 1; }
          [ -f "$TEST_HOME/.config/hypr/hypridle.conf" ] || { echo "Failed: hypridle.conf missing"; exit 1; }
          [ -f "$TEST_HOME/.config/hypr/hyprlock.conf" ] || { echo "Failed: hyprlock.conf missing"; exit 1; }

          # 4. Check for broken links
          broken=$(find "$TEST_HOME" -xtype l)
          if [ -n "$broken" ]; then
            echo "❌ Broken symlinks found in mock deployment:"
            echo "$broken"
            exit 1
          fi

          echo "✅ Mock deployment succeeded for ${{ matrix.template }}."

  # ----------------------------------------------------------------------------
  # JOB 5: Continuous Delivery (CD) — Automated GitHub Release Packaging
  # ----------------------------------------------------------------------------
  release-automation:
    name: Continuous Delivery & Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint-and-syntax, repo-hygiene, script-smoke-tests, arch-stow-matrix]
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Package Release Distribution
        run: |
          TAG_NAME="${{ github.ref_name }}"
          PKG_NAME="hyprland-dotfiles-${TAG_NAME}"
          echo "=== Packaging Release Archive: ${PKG_NAME}.tar.gz ==="

          # Create clean release tarball excluding .git, caches, and untracked host secrets
          tar --exclude='.git' \
              --exclude='.github' \
              --exclude='tests' \
              --exclude='*.pyc' \
              --exclude='__pycache__' \
              --exclude='main' \
              -czvf "${PKG_NAME}.tar.gz" \
              core home hosts/_template hyprland installer DIY_GUIDE.md MANUAL.md README.md LICENSE

          # Generate SHA256 checksum
          sha256sum "${PKG_NAME}.tar.gz" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Extract Release Notes
        id: release_notes
        run: |
          TAG_NAME="${{ github.ref_name }}"
          NOTES_FILE="RELEASE_NOTES_${TAG_NAME}.md"
          if [ -f "$NOTES_FILE" ]; then
            echo "Found release notes file: $NOTES_FILE"
            echo "notes_file=$NOTES_FILE" >> "$GITHUB_OUTPUT"
          else
            echo "notes_file=" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            hyprland-dotfiles-${{ github.ref_name }}.tar.gz
            SHA256SUMS.txt
          body_path: ${{ steps.release_notes.outputs.notes_file }}
          generate_release_notes: true
          draft: false
          prerelease: false
