name: CD Mirror to GitLab

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  mirror:
    name: Sync GitLab Mirror
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for GitLab SSH Credentials
        id: check_key
        run: |
          if [ -n "${{ secrets.GITLAB_SSH_PRIVATE_KEY }}" ]; then
            echo "has_key=true" >> "$GITHUB_OUTPUT"
            echo "GitLab SSH private key found. Proceeding with mirror sync."
          else
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Mirror Skipped::GITLAB_SSH_PRIVATE_KEY secret is not set in GitHub repository settings. Set this secret to enable automatic GitLab mirroring."
          fi

      - name: Push Mirror to GitLab
        if: steps.check_key.outputs.has_key == 'true'
        uses: pixta-dev/repository-mirroring-action@v1
        with:
          target_repo_url: git@gitlab.com:He3rmit/hyprland-dotfiles.git
          ssh_private_key: ${{ secrets.GITLAB_SSH_PRIVATE_KEY }}
